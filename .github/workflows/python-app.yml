name: Python application

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: isatambra/senai_api_ta
  CONTAINER_NAME: fastapi-container

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Testando o codigo
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Executar o pytest no projeto
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

  Imagem:
    name: Construindo imagem para o docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PWD }}

      - name: Configurar o Docker na VM
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy_homolog:
    name: Deploy Homologacao
    runs-on: ubuntu-latest

    needs: Imagem

    if: github.ref == 'refs/heads/develop'

    environment: homolog

    steps:
      - name: Deploy na EC2 de Homologacao
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST_HML }}
          username: ${{ secrets.EC2_USERNAME_HML }}
          key: ${{ secrets.EC2_SSH_KEY_HML }}

          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              -p 8080:8080 \
              --name ${{ env.CONTAINER_NAME }} \
              ${{ env.IMAGE_NAME }}:latest

  deploy_producao:
    name: Deploy Producao
    runs-on: ubuntu-latest

    needs: Imagem

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Deploy na EC2 de Producao
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest

            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              -p 8080:8080 \
              --name ${{ env.CONTAINER_NAME }} \
              ${{ env.IMAGE_NAME }}:latest
